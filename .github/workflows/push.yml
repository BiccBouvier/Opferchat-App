name: Push-Server einrichten
on:
  push:
    branches: [main]
    paths: ['.github/workflows/push.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SA: ${{ secrets.FIREBASE_SA }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
      DB_URL: https://opferchat-default-rtdb.europe-west1.firebasedatabase.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Geheimnisse prüfen
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt"; exit 1; }
          node -e "const s=JSON.parse(process.env.SA);if(!s.private_key||!s.client_email)throw new Error('kein Dienstkonto');if(s.project_id!=='opferchat')throw new Error('falsches Projekt: '+s.project_id);console.log('Dienstkonto ok:',s.client_email)"
      - name: Cloudflare prüfen
        run: |
          ID="$CLOUDFLARE_ACCOUNT_ID"
          if echo "$ID" | grep -Eq '^[0-9a-f]{32}$'; then echo "Account ID hat das richtige Format"; else echo "::error::CLOUDFLARE_ACCOUNT_ID sieht falsch aus: Sie muss 32 Zeichen lang sein (Ziffern und a-f), sie ist ${#ID} Zeichen lang."; fi
          chk(){ R=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"); echo "$R" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const e=(j.errors||[]).map(x=>x.code+' '+x.message).join('; ');console.log('$2: '+(j.success?'OK':'NEIN')+(j.result&&j.result.status?' ('+j.result.status+')':'')+(j.result&&j.result.subdomain?' Subdomain: '+j.result.subdomain:'')+(e?' – '+e:''))}catch(x){console.log('$2: keine Antwort')}})"; }
          chk "accounts/$ID/tokens/verify" "Token als Konto-Token"
          chk "user/tokens/verify" "Token als Benutzer-Token"
          chk "accounts/$ID" "Zugriff auf das Konto"
          chk "accounts/$ID/workers/subdomain" "workers.dev-Subdomain"
          chk "accounts/$ID/workers/scripts" "Workers lesen"
      - name: Server-Teil schreiben
        run: |
          mkdir push && cd push
          cat > wrangler.toml <<'EOF'
          name = "opferchat-push"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          workers_dev = true
          [vars]
          DB_URL = "https://opferchat-default-rtdb.europe-west1.firebasedatabase.app"
          PROJECT_ID = "opferchat"
          EOF
          cat > worker.js <<'EOF'
          // Opferchat Push: verschickt Push-Benachrichtigungen an die Android-App (Firebase Cloud Messaging), setzt Passwörter neu und liefert TURN-Zugangsdaten für Anrufe
          const enc = new TextEncoder(), dec = new TextDecoder();
          let AT = null, ATX = 0, JW = null, JWX = 0;
          const b64u = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
          const b64uStr = s => b64u(enc.encode(s));
          const b64dec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u };

          async function accessToken(env) {
            const now = Math.floor(Date.now() / 1000);
            if (AT && ATX > now + 120) return AT;
            const sa = JSON.parse(env.SA);
            const h = b64uStr(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const c = b64uStr(JSON.stringify({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/firebase.database https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/firebase.messaging https://www.googleapis.com/auth/identitytoolkit https://www.googleapis.com/auth/cloud-platform', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 }));
            const pem = sa.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
            const key = await crypto.subtle.importKey('pkcs8', b64dec(pem), { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
            const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, enc.encode(h + '.' + c));
            const r = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=' + h + '.' + c + '.' + b64u(sig) });
            const j = await r.json();
            if (!j.access_token) throw new Error('oauth ' + JSON.stringify(j).slice(0, 200));
            AT = j.access_token; ATX = now + (j.expires_in || 3600); return AT;
          }

          async function verifyIdToken(t, pid) {
            const parts = String(t || '').split('.');
            if (parts.length !== 3) throw new Error('token');
            const H = JSON.parse(dec.decode(b64dec(parts[0]))), P = JSON.parse(dec.decode(b64dec(parts[1])));
            const now = Date.now() / 1000;
            if (P.aud !== pid || P.iss !== 'https://securetoken.google.com/' + pid || !(P.exp > now) || !P.sub) throw new Error('claims');
            if (!JW || JWX < Date.now()) { const r = await fetch('https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com'); JW = (await r.json()).keys || []; JWX = Date.now() + 3600e3 }
            const jwk = JW.find(k => k.kid === H.kid);
            if (!jwk) throw new Error('kid');
            const key = await crypto.subtle.importKey('jwk', { kty: jwk.kty, n: jwk.n, e: jwk.e, alg: 'RS256', ext: true }, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['verify']);
            const ok = await crypto.subtle.verify('RSASSA-PKCS1-v1_5', key, b64dec(parts[2]), enc.encode(parts[0] + '.' + parts[1]));
            if (!ok) throw new Error('sig');
            return P.sub;
          }

          async function db(env, path, o = {}) {
            const t = await accessToken(env);
            const r = await fetch(env.DB_URL + '/' + path + '.json?access_token=' + t + (o.q ? '&' + o.q : ''), { method: o.m || 'GET', body: o.b !== undefined ? JSON.stringify(o.b) : undefined });
            if (!r.ok) throw new Error('db ' + r.status + ' ' + path);
            return r.json();
          }

          function preview(m) {
            const t = String(m.t || '').replace(/\|\|[\s\S]+?\|\|/g, '•••');
            let s = m.sp ? '🙈 Spoiler' : m.once ? '📷 Einmalbild' : m.img ? '📷 Foto' + (t ? ': ' + t : '') : m.vid ? '🎬 Video' : m.aud ? '🎤 Sprachnachricht' : m.gif ? 'GIF' :
              m.file ? '📎 ' + (m.file.n || 'Datei') : m.loc ? '📍 Standort' : (m.stk || m.stc) ? 'Sticker' : m.po ? '📊 Umfrage: ' + t : m.gm ? '🎮 Spiel' : t;
            s = s || 'Neue Nachricht';
            return s.length > 180 ? s.slice(0, 177) + '…' : s;
          }

          async function send(env, rec, gid, sender, o, budget) {
            if (!rec.length) return 0;
            if (!budget.all) budget.all = (await db(env, 'push')) || {};
            const all = budget.all;
            if (sender && !budget.blk) budget.blk = (await db(env, 'blockedby/' + sender)) || {};
            const blk = sender ? budget.blk : {};
            rec = rec.filter(u => all[u] && !blk[u]);
            const t = await accessToken(env);
            let n = 0;
            for (const u of rec) {
              if (budget.left < 2) break;
              budget.left--;
              let mu = null; try { mu = await db(env, 'me/' + u + '/mu/' + gid) } catch (e) { }
              if (mu) continue;
              for (const [k, v] of Object.entries(all[u] || {})) {
                if (!v || !v.t || budget.left < 1) continue;
                budget.left--;
                // Neue App (s: 2): eigene Kanäle mit eigenen Klingeltönen
                const s2 = v.s === 2;
                const ch = s2 ? (o.type === 'rq' ? 'oc_rq' : o.channel === 'calls' ? 'oc_calls' : 'oc_msgs') : o.channel;
                const snd = s2 ? ({ oc_rq: 'oc_rq', oc_calls: 'oc_ring', oc_msgs: 'oc_msg' })[ch] : 'default';
                const msg = { message: { token: v.t, notification: { title: o.title, body: o.body }, data: { gid, type: o.type },
                  android: { priority: 'HIGH', ttl: o.ttl || '86400s', notification: { channel_id: ch, tag: o.type === 'call' ? 'call_' + gid : gid, icon: 'ic_stat_notify', color: '#ffe14d', sound: snd } } } };
                const r = await fetch('https://fcm.googleapis.com/v1/projects/' + env.PROJECT_ID + '/messages:send', { method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });
                if (r.ok) n++;
                else { const e = await r.text(); if ((r.status === 404 || /UNREGISTERED/.test(e)) && budget.left > 0) { budget.left--; try { await db(env, 'push/' + u + '/' + k, { m: 'DELETE' }) } catch (x) { } } else console.log('fcm', r.status, e.slice(0, 200)) }
              }
            }
            return n;
          }

          async function notify(env, uid, body) {
            const budget = { left: 30 };
            if (body.test) {
              const mine = (await db(env, 'push/' + uid)) || {};
              const dev = Object.keys(mine).length;
              if (!dev) return { n: 0, dev: 0 };
              budget.all = { [uid]: mine };
              const n = await send(env, [uid], 'test', null, { title: 'Opferchat', body: 'Test: Push-Benachrichtigungen funktionieren.', channel: 'msgs', type: 'test', ttl: '300s' }, budget);
              return { n, dev, e: n ? null : 'FCM' };
            }
            if (body.rq) {
              const rid = String(body.rq || '');
              if (!/^[A-Za-z0-9]{6,64}$/.test(rid) || rid === uid) return { e: 'rq' };
              const r = await db(env, 'rq/' + rid + '/' + uid);
              if (!r || r.s !== 0 || Date.now() - (r.ts || 0) > 600000) return { e: 'norq' };
              const done = await db(env, 'pushd/rq_' + rid + '/' + uid);
              if (done && done === r.ts) return { n: 0 };
              await db(env, 'pushd/rq_' + rid + '/' + uid, { m: 'PUT', b: r.ts });
              const who = (await db(env, 'users/' + uid + '/name')) || 'Jemand';
              return { n: await send(env, [rid], 'rq', uid, { title: 'Nachrichtenanfrage', body: who + ' möchte dir schreiben', channel: 'msgs', type: 'rq' }, budget) };
            }
            const gid = String(body.gid || '');
            if (!/^[A-Za-z0-9_-]{1,120}$/.test(gid)) return { e: 'gid' };
            const pub = gid === 'allgemein';
            const g = pub ? {} : await db(env, 'groups/' + gid);
            if (!pub && !g) return { e: 'nogroup' };
            const members = pub ? [] : Object.keys(g.dm || g.members || {});
            if (!pub && !members.includes(uid)) return { e: 'member' };
            const NM = {}; const name = async u => { if (NM[u]) return NM[u]; try { NM[u] = (await db(env, 'users/' + u + '/name')) || 'Jemand' } catch (e) { NM[u] = 'Jemand' } return NM[u] };
            if (body.call) {
              if (pub) return { e: 'pub' };
              const info = await db(env, 'calls/' + gid + '/info');
              if (!info || info.by !== uid || Date.now() - (info.ts || 0) > 90000) return { e: 'nocall' };
              const who = await name(uid);
              const title = (info.v ? '📹 ' : '📞 ') + who + (g.dm ? ' ruft dich an' : ' ruft in ' + (g.name || 'der Gruppe') + ' an');
              return { n: await send(env, members.filter(u => u !== uid), gid, uid, { title, body: info.v ? 'Videoanruf · Tippen zum Annehmen' : 'Sprachanruf · Tippen zum Annehmen', channel: 'calls', type: 'call', ttl: '45s' }, budget) };
            }
            const ms = (await db(env, 'chatmsgs/' + gid, { q: 'orderBy=%22%24key%22&limitToLast=4' })) || {};
            const done = (await db(env, 'pushd/' + gid, { q: 'orderBy=%22%24key%22&limitToLast=12' })) || {};
            let n = 0;
            for (const [mid, m] of Object.entries(ms)) {
              if (!m || m.del || done[mid] || Date.now() - (m.ts || 0) > 600000) continue;
              if (m.uid !== uid && !(pub && m.uid === 'anon')) continue;
              await db(env, 'pushd/' + gid + '/' + mid, { m: 'PUT', b: 1 });
              let rec = pub ? Object.keys(m.mn || {}) : members;
              rec = rec.filter(u => u !== uid);
              if (!rec.length) continue;
              const who = m.uid === 'anon' ? (m.an || 'Anonym') : await name(uid);
              const txt = preview(m);
              const title = g.dm ? who : pub ? who + ' im Public Chat' : (g.name || 'Gruppe');
              n += await send(env, rec, gid, m.uid === 'anon' ? null : uid, { title, body: (g.dm || pub) ? txt : who + ': ' + txt, channel: 'msgs', type: 'msg' }, budget);
            }
            return { n };
          }

          async function setPw(env, uid, body) {
            const pw = String(body.pw || '');
            if (pw.length < 6 || pw.length > 128) return { e: 'pw' };
            const t = await accessToken(env);
            const r = await fetch('https://identitytoolkit.googleapis.com/v1/projects/' + env.PROJECT_ID + '/accounts:update', { method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ localId: uid, password: pw }) });
            if (!r.ok) { console.log('pw', r.status, (await r.text()).slice(0, 200)); return { e: 'auth' } }
            return { ok: 1 };
          }

          let TC = null, TCX = 0;
          async function turn(env) {
            if (!env.TURN_KEY_ID || !env.TURN_KEY_TOKEN) return { iceServers: [] };
            if (TC && TCX > Date.now()) return TC;
            const r = await fetch('https://rtc.live.cloudflare.com/v1/turn/keys/' + env.TURN_KEY_ID + '/credentials/generate-ice-servers', { method: 'POST', headers: { Authorization: 'Bearer ' + env.TURN_KEY_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify({ ttl: 86400 }) });
            if (!r.ok) { console.log('turn', r.status, (await r.text()).slice(0, 200)); return { iceServers: [] } }
            const j = await r.json();
            TC = { iceServers: (j.iceServers || []).map(s => ({ ...s, urls: [].concat(s.urls || []).filter(u => !/:53(\?|$)/.test(u)) })).filter(s => s.urls.length) };
            TCX = Date.now() + 6 * 3600e3;
            return TC;
          }

          const CORS = { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'POST, OPTIONS', 'Access-Control-Allow-Headers': 'Content-Type, Authorization' };
          export default {
            async fetch(req, env) {
              if (req.method === 'OPTIONS') return new Response(null, { headers: CORS });
              const url = new URL(req.url);
              if (req.method === 'GET') return new Response('Opferchat Push läuft', { headers: CORS });
              if (!['/notify', '/pw', '/turn'].includes(url.pathname) || req.method !== 'POST') return new Response('nicht gefunden', { status: 404, headers: CORS });
              let uid;
              try { uid = await verifyIdToken((req.headers.get('Authorization') || '').replace(/^Bearer /, ''), env.PROJECT_ID) } catch (e) { return new Response('nicht angemeldet', { status: 401, headers: CORS }) }
              try { const body = await req.json().catch(() => ({})); const r = url.pathname === '/pw' ? await setPw(env, uid, body) : url.pathname === '/turn' ? await turn(env) : await notify(env, uid, body); return new Response(JSON.stringify(r), { headers: { ...CORS, 'Content-Type': 'application/json' } }) }
              catch (e) { console.log('Fehler', String(e)); return new Response('Fehler', { status: 500, headers: CORS }) }
            }
          };
          EOF
      - name: Zu Cloudflare hochladen
        run: |
          cd push
          ID="$CLOUDFLARE_ACCOUNT_ID";API="https://api.cloudflare.com/client/v4/accounts/$ID/workers"
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log || true
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            echo "Keine Adresse im Log, warte kurz und schalte workers.dev selbst ein"
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/subdomain" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(JSON.parse(d).result.subdomain||'')}catch(e){}})")
            [ -n "$SUB" ] || { echo "::error::Keine workers.dev-Subdomain. Lege in Cloudflare unter Workers & Pages einmal eine Subdomain fest."; exit 1; }
            OK=0
            for i in 1 2 3 4 5 6 7 8; do
              sleep 10
              R=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"enabled":true,"previews_enabled":true}' "$API/scripts/opferchat-push/subdomain")
              echo "Versuch $i: $(echo "$R" | head -c 200)"
              if echo "$R" | grep -q '"success":true'; then OK=1; break; fi
            done
            [ "$OK" = 1 ] || { echo "::error::workers.dev konnte nicht eingeschaltet werden"; exit 1; }
            URL="https://opferchat-push.$SUB.workers.dev"
          fi
          printf '%s' "$SA" | npx --yes wrangler@4 secret put SA
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_TOKEN" ]; then
            printf '%s' "$TURN_KEY_ID" | npx --yes wrangler@4 secret put TURN_KEY_ID
            printf '%s' "$TURN_KEY_TOKEN" | npx --yes wrangler@4 secret put TURN_KEY_TOKEN
            echo "TURN-Server für Anrufe eingerichtet"
          else
            echo "Kein TURN-Schlüssel hinterlegt (TURN_KEY_ID, TURN_KEY_TOKEN). Anrufe laufen ohne eigenen TURN-Server."
          fi
          for i in $(seq 1 12); do T=$(curl -s --max-time 10 "$URL" || true); if echo "$T" | grep -q "Opferchat Push"; then echo "Push-Server antwortet"; break; fi; echo "warte auf $URL ($i)"; sleep 10; done
          echo "URL=$URL" >> $GITHUB_ENV
          echo "Push-Server: $URL"
      - name: Adresse in Firebase eintragen
        run: |
          node -e "$CFG" "$URL"
        env:
          CFG: |
            const sa=JSON.parse(process.env.SA),url=process.argv[1],c=require('crypto');
            const b=o=>Buffer.from(JSON.stringify(o)).toString('base64url'),now=Math.floor(Date.now()/1000);
            const h=b({alg:'RS256',typ:'JWT'}),p=b({iss:sa.client_email,scope:'https://www.googleapis.com/auth/firebase.database https://www.googleapis.com/auth/userinfo.email',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+600});
            const s=c.createSign('RSA-SHA256').update(h+'.'+p).sign(sa.private_key).toString('base64url');
            (async()=>{const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion='+h+'.'+p+'.'+s});const j=await r.json();if(!j.access_token){console.log(j);process.exit(1)}
            const q=await fetch(process.env.DB_URL+'/pushcfg/url.json?access_token='+j.access_token,{method:'PUT',body:JSON.stringify(url)});console.log('pushcfg/url',q.status,await q.text());if(!q.ok)process.exit(1)})();
      - name: Testen
        run: |
          sleep 5
          curl -s "$URL" ; echo
