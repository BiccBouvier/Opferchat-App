name: Android-App bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Projekt anlegen
        run: |
          mkdir -p app/www app/assets
          cd app
          echo '{"name":"opferchat-app","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/push-notifications@7 @capacitor/app@7 @capacitor/haptics@7
          # Zusatzfunktionen fuer spaeter. Was sich nicht einbauen laesst, wird einfach uebersprungen.
          : > opt_official_ok.txt; : > opt_community_ok.txt
          for n in @capacitor/camera @capacitor/clipboard @capacitor/device @capacitor/geolocation @capacitor/local-notifications @capacitor/network @capacitor/preferences @capacitor/screen-orientation @capacitor/browser @capacitor/motion; do
            if npm install --no-audit --no-fund $n@7 >/dev/null 2>&1; then echo $n >> opt_official_ok.txt; else echo "::warning::$n ließ sich nicht einbauen"; fi
          done
          for n in @capacitor-community/keep-awake @capacitor-community/speech-recognition @capacitor-community/text-to-speech @capacitor-community/media @capacitor-mlkit/barcode-scanning @capawesome/capacitor-badge @capawesome/capacitor-file-picker @capgo/capacitor-native-biometric; do
            if npm install --no-audit --no-fund $n@7 >/dev/null 2>&1; then echo $n >> opt_community_ok.txt; else echo "::warning::$n ließ sich nicht einbauen"; fi
          done
          echo "Eingebaut (offiziell):"; cat opt_official_ok.txt; echo "Eingebaut (Community):"; cat opt_community_ok.txt
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.opferchat.app","appName":"Opferchat","webDir":"www",
           "server":{"url":"https://opferchat.com","androidScheme":"https","errorPath":"offline.html"},
           "appendUserAgent":"OpferchatApp/1","backgroundColor":"#1d2340",
           "android":{"allowMixedContent":false},
           "plugins":{"PushNotifications":{"presentationOptions":["badge","sound","alert"]},"LocalNotifications":{"smallIcon":"ic_stat_notify","iconColor":"#FFE14D"}}}
          EOF
          cat > www/offline.html <<'EOF'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{margin:0;height:100vh;display:grid;place-items:center;background:#1d2340;color:#fff;font:16px system-ui;text-align:center}button{margin-top:18px;padding:12px 22px;border:0;border-radius:14px;background:#ffe14d;font-weight:700;font-size:16px}</style></head>
          <body><div><h2>Keine Verbindung</h2><p>Opferchat braucht Internet.<br>Prüf dein WLAN oder deine mobilen Daten.</p><button onclick="location.href='https://opferchat.com'">Nochmal versuchen</button></div></body></html>
          EOF
          cp www/offline.html www/index.html
          npx cap add android
          if [ -f ../google-services.json ]; then cp ../google-services.json android/app/google-services.json; echo "google-services.json eingebaut"; else echo "::warning::google-services.json fehlt, Push geht noch nicht"; fi
          npx cap sync android
      - name: Eigene Android-Teile, Klingeltöne und Build-Einstellungen
        run: |
          cd app
          P=android/app/src/main/java/com/opferchat/app
          mkdir -p $P
          cp $P/MainActivity.java MainActivity.java.orig
          cat > $P/CallService.java <<'EOF'
          package com.opferchat.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Person;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.PowerManager;

          /* Hält während eines Anrufs das Mikrofon (und die Verbindung) am Leben, auch wenn die App nicht vorne ist.
             Zeigt dazu die Anruf-Benachrichtigung mit Stumm, Lautsprecher oder Kamera und Auflegen
             (ab Android 12 als Anruf oben in der Statusleiste). */
          public class CallService extends Service {
              static final String CHANNEL = "oc_call_live";
              static final String OLD_CHANNEL = "oc_call_running";
              static final int NOTE_ID = 7101;
              static volatile CallService inst = null;
              static volatile State last = null;
              private PowerManager.WakeLock wl;

              static final class State {
                  String name = "Opferchat";
                  String status = "";
                  boolean muted = false;
                  boolean speaker = true;
                  boolean cam = false;
                  boolean video = false;
                  boolean spkBtn = false;
                  long since = 0;
              }

              /* Neuer Stand von der Webseite (stumm, Lautsprecher, Kamera, Name, verbunden seit) */
              static void update(Context c, State s) {
                  last = s;
                  CallService me = inst;
                  if (me == null) return;
                  try {
                      me.post(s);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  inst = this;
                  String title = intent != null ? intent.getStringExtra("title") : null;
                  boolean video = intent != null && intent.getBooleanExtra("video", false);
                  State s = last;
                  if (s == null) {
                      s = new State();
                      if (title != null && !title.isEmpty()) s.name = title;
                      s.video = video;
                      s.cam = video;
                      last = s;
                  }
                  try {
                      Notification n = build(s);
                      boolean ok = false;
                      if (Build.VERSION.SDK_INT >= 30) {
                          try {
                              int type = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                              if (video) type |= ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA;
                              startForeground(NOTE_ID, n, type);
                              ok = true;
                          } catch (Exception e1) {
                              try {
                                  startForeground(NOTE_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                                  ok = true;
                              } catch (Exception e2) {
                                  ok = false;
                              }
                          }
                      } else {
                          startForeground(NOTE_ID, n);
                          ok = true;
                      }
                      if (!ok) {
                          stopSelf();
                          return START_NOT_STICKY;
                      }
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null && (wl == null || !wl.isHeld())) {
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Opferchat:call");
                          wl.setReferenceCounted(false);
                          wl.acquire(4 * 60 * 60 * 1000L);
                      }
                  } catch (Exception e) {
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void post(State s) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(NOTE_ID, build(s));
              }

              private void ensureChannel(NotificationManager nm) {
                  if (Build.VERSION.SDK_INT < 26 || nm == null) return;
                  if (nm.getNotificationChannel(CHANNEL) == null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, IncomingCall.label(this, "running", "Laufender Anruf"), NotificationManager.IMPORTANCE_DEFAULT);
                      ch.setShowBadge(false);
                      ch.setSound(null, null);
                      ch.enableVibration(false);
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(ch);
                  }
                  try {
                      if (nm.getNotificationChannel(OLD_CHANNEL) != null) nm.deleteNotificationChannel(OLD_CHANNEL);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              private PendingIntent actPI(String what, int rc) {
                  Intent i = new Intent(this, CallActionReceiver.class);
                  i.setAction(CallActionReceiver.ACT);
                  i.putExtra("a", what);
                  return PendingIntent.getBroadcast(this, 7300 + rc, i, IncomingCall.piFlags());
              }

              private Notification.Action act(String label, PendingIntent pi) {
                  Icon ic = Icon.createWithResource(this, IncomingCall.smallIcon(this));
                  return new Notification.Action.Builder(ic, label, pi).build();
              }

              private Notification build(State s) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  ensureChannel(nm);
                  Intent open = new Intent(this, MainActivity.class);
                  open.setAction(IncomingCall.ACT_OPEN);
                  open.putExtra("act", "open");
                  open.putExtra("gid", "-");
                  open.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 7310, open, IncomingCall.piFlags());
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                  b.setSmallIcon(IncomingCall.smallIcon(this));
                  b.setContentTitle(s.name);
                  String kind = s.video ? IncomingCall.label(this, "video", "Videoanruf") : IncomingCall.label(this, "voice", "Sprachanruf");
                  String text = s.status != null && !s.status.isEmpty() ? s.status : kind;
                  if (s.muted) text = text + " · " + IncomingCall.label(this, "muted", "stumm");
                  b.setContentText(text);
                  b.setContentIntent(pi);
                  b.setOngoing(true);
                  b.setOnlyAlertOnce(true);
                  b.setCategory(Notification.CATEGORY_CALL);
                  b.setVisibility(Notification.VISIBILITY_PUBLIC);
                  if (s.since > 0) {
                      b.setWhen(s.since);
                      b.setShowWhen(true);
                      b.setUsesChronometer(true);
                  } else {
                      b.setShowWhen(false);
                  }
                  PendingIntent hang = actPI("hang", 1);
                  Notification.Action mute = act(s.muted ? IncomingCall.label(this, "unmute", "Ton an") : IncomingCall.label(this, "mute", "Stumm"), actPI("mute", 2));
                  Notification.Action third;
                  if (s.spkBtn && !s.video && !s.cam) {
                      third = act(s.speaker ? IncomingCall.label(this, "ear", "Hörer") : IncomingCall.label(this, "spk", "Lautsprecher"), actPI("spk", 3));
                  } else {
                      third = act(s.cam ? IncomingCall.label(this, "camoff", "Kamera aus") : IncomingCall.label(this, "cam", "Kamera"), actPI("cam", 4));
                  }
                  if (Build.VERSION.SDK_INT >= 31) {
                      Person p = new Person.Builder().setName(s.name).setIcon(Icon.createWithBitmap(IncomingCall.letter(s.name))).setImportant(true).build();
                      b.setStyle(Notification.CallStyle.forOngoingCall(p, hang).setIsVideo(s.video));
                      b.addAction(mute);
                      b.addAction(third);
                  } else {
                      b.addAction(act(IncomingCall.label(this, "hang", "Auflegen"), hang));
                      b.addAction(mute);
                      b.addAction(third);
                  }
                  /* Android 16: als "Live-Update" oben anzeigen (z. B. in der Kapsel um die Kamera) */
                  Bundle ex = new Bundle();
                  ex.putBoolean("android.requestPromotedOngoing", true);
                  b.addExtras(ex);
                  return b.build();
              }

              private void release() {
                  try {
                      if (wl != null && wl.isHeld()) wl.release();
                  } catch (Exception e) {
                      /* egal */
                  }
                  wl = null;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  release();
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  if (inst == this) inst = null;
                  last = null;
                  release();
                  super.onDestroy();
              }
          }
          EOF
          cat > $P/OcNativePlugin.java <<'EOF'
          package com.opferchat.app;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.app.NotificationManager;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          /* Eigene Android-Funktionen fuer Opferchat. Die Webseite ruft sie ueber Capacitor.Plugins.OcNative auf. */
          @CapacitorPlugin(name = "OcNative")
          public class OcNativePlugin extends Plugin {
              static final int VERSION = 3;
              static volatile boolean callActive = false;
              static volatile JSObject pendingShare = null;
              static volatile JSObject pendingCall = null;
              static volatile OcNativePlugin inst = null;
              private PowerManager.WakeLock prox;

              @Override
              public void load() {
                  inst = this;
              }

              /* Ereignis an die Webseite (callAction, callLaunch) */
              static void emit(String ev, JSObject data) {
                  OcNativePlugin p = inst;
                  if (p == null) return;
                  try {
                      p.notifyListeners(ev, data);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              /* Die App wurde wegen eines Anrufs geöffnet (Klingeln, Annehmen, Nachricht, laufender Anruf) */
              static void setLaunch(JSObject o) {
                  pendingCall = o;
                  emit("callLaunch", new JSObject());
              }

              /* Wird von MainActivity aufgerufen: Text oder Bild, das in Opferchat geteilt wurde. */
              static void handleIntent(Intent in) {
                  try {
                      if (in == null) return;
                      if (!Intent.ACTION_SEND.equals(in.getAction())) return;
                      String type = in.getType();
                      if (type == null) return;
                      JSObject o = new JSObject();
                      if (type.startsWith("text/")) {
                          CharSequence cs = in.getCharSequenceExtra(Intent.EXTRA_TEXT);
                          if (cs == null || cs.length() == 0) return;
                          o.put("kind", "text");
                          o.put("text", cs.toString());
                      } else if (type.startsWith("image/")) {
                          Uri u = getStream(in);
                          if (u == null) return;
                          o.put("kind", "image");
                          o.put("uri", u.toString());
                          o.put("mime", type);
                      } else {
                          return;
                      }
                      pendingShare = o;
                      in.setAction(null);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              @SuppressWarnings("deprecation")
              private static Uri getStream(Intent in) {
                  if (Build.VERSION.SDK_INT >= 33) return in.getParcelableExtra(Intent.EXTRA_STREAM, Uri.class);
                  return (Uri) in.getParcelableExtra(Intent.EXTRA_STREAM);
              }

              @PluginMethod
              public void info(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("v", VERSION);
                  o.put("sdk", Build.VERSION.SDK_INT);
                  call.resolve(o);
              }

              @PluginMethod
              public void callStart(PluginCall call) {
                  try {
                      Context c = getContext();
                      Intent i = new Intent(c, CallService.class);
                      i.putExtra("title", call.getString("title", "Opferchat"));
                      i.putExtra("text", call.getString("text", "Anruf läuft"));
                      i.putExtra("video", Boolean.TRUE.equals(call.getBoolean("video", false)));
                      if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i);
                      else c.startService(i);
                      callActive = true;
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void callStop(PluginCall call) {
                  callActive = false;
                  try {
                      Context c = getContext();
                      c.stopService(new Intent(c, CallService.class));
                  } catch (Exception e) {
                      /* egal */
                  }
                  call.resolve();
              }

              /* Anruf-Audio: call=true schaltet den Telefon-Modus ein, speaker=true den Lautsprecher. */
              @SuppressWarnings("deprecation")
              @PluginMethod
              public void setAudio(PluginCall call) {
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if (am == null) {
                          call.reject("kein AudioManager");
                          return;
                      }
                      boolean on = Boolean.TRUE.equals(call.getBoolean("call", true));
                      boolean sp = Boolean.TRUE.equals(call.getBoolean("speaker", false));
                      am.setMode(on ? AudioManager.MODE_IN_COMMUNICATION : AudioManager.MODE_NORMAL);
                      am.setSpeakerphoneOn(on && sp);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              /* Bildschirm aus, wenn das Handy ans Ohr gehalten wird. */
              @PluginMethod
              public void proximity(PluginCall call) {
                  try {
                      boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      if (on) {
                          if (pm != null && pm.isWakeLockLevelSupported(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK)) {
                              if (prox == null) {
                                  prox = pm.newWakeLock(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK, "Opferchat:prox");
                                  prox.setReferenceCounted(false);
                              }
                              if (!prox.isHeld()) prox.acquire(4 * 60 * 60 * 1000L);
                          }
                      } else if (prox != null && prox.isHeld()) {
                          prox.release();
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              /* Geteilter Inhalt, der noch nicht abgeholt wurde. Wird beim Abholen geloescht. */
              @PluginMethod
              public void getShared(PluginCall call) {
                  JSObject o = pendingShare;
                  pendingShare = null;
                  call.resolve(o != null ? o : new JSObject());
              }

              /* Liest eine geteilte Datei (content://) und gibt sie als Base64 zurueck. */
              @PluginMethod
              public void readUri(PluginCall call) {
                  String uri = call.getString("uri");
                  int max = call.getInt("max", 8 * 1024 * 1024);
                  if (uri == null) {
                      call.reject("uri fehlt");
                      return;
                  }
                  InputStream in = null;
                  try {
                      ContentResolver cr = getContext().getContentResolver();
                      Uri u = Uri.parse(uri);
                      in = cr.openInputStream(u);
                      if (in == null) {
                          call.reject("nicht lesbar");
                          return;
                      }
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          if (bo.size() > max) {
                              call.reject("zu gross");
                              return;
                          }
                      }
                      JSObject o = new JSObject();
                      o.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                      String mime = cr.getType(u);
                      o.put("mime", mime != null ? mime : "application/octet-stream");
                      call.resolve(o);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  } finally {
                      try {
                          if (in != null) in.close();
                      } catch (Exception e) {
                          /* egal */
                      }
                  }
              }

              /* Anruf, mit dem die App geöffnet wurde. Wird beim Abholen gelöscht. */
              @PluginMethod
              public void getLaunch(PluginCall call) {
                  JSObject o = pendingCall;
                  pendingCall = null;
                  call.resolve(o != null ? o : new JSObject());
              }

              /* Android-Klingeln beenden (die Webseite zeigt den Anruf jetzt selbst) */
              @PluginMethod
              public void ringStop(PluginCall call) {
                  IncomingCall.cancel(getContext(), null);
                  call.resolve();
              }

              /* Stand des laufenden Anrufs für die Anruf-Benachrichtigung */
              @PluginMethod
              public void callUpdate(PluginCall call) {
                  JSObject d = call.getData();
                  CallService.State s = new CallService.State();
                  s.name = d.optString("n", "Opferchat");
                  if (s.name.isEmpty()) s.name = "Opferchat";
                  s.status = d.optString("st", "");
                  s.muted = d.optBoolean("m", false);
                  s.speaker = d.optBoolean("s", true);
                  s.cam = d.optBoolean("c", false);
                  s.video = d.optBoolean("v", false);
                  s.spkBtn = d.optBoolean("sp", false);
                  s.since = d.optLong("t", 0L);
                  CallService.update(getContext(), s);
                  call.resolve();
              }

              /* Anmeldeschlüssel und Texte für das Ablehnen bei geschlossener App. Bleibt nur auf diesem Handy. */
              @PluginMethod
              public void setAuth(PluginCall call) {
                  JSObject d = call.getData();
                  SharedPreferences.Editor e = getContext().getSharedPreferences(IncomingCall.PREF, Context.MODE_PRIVATE).edit();
                  e.putString("rt", d.optString("rt", ""));
                  e.putString("key", d.optString("key", ""));
                  e.putString("db", d.optString("db", ""));
                  e.putString("uid", d.optString("uid", ""));
                  Object lb = d.opt("lb");
                  if (lb != null) e.putString("lb", lb.toString());
                  e.apply();
                  call.resolve();
              }

              @PluginMethod
              public void clearAuth(PluginCall call) {
                  getContext().getSharedPreferences(IncomingCall.PREF, Context.MODE_PRIVATE).edit().clear().apply();
                  call.resolve();
              }

              /* Darf die App Anrufe als Vollbild zeigen? (ab Android 14 eine eigene Erlaubnis) */
              @PluginMethod
              public void fsiStatus(PluginCall call) {
                  JSObject o = new JSObject();
                  boolean can = true;
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                          can = nm != null && nm.canUseFullScreenIntent();
                      }
                  } catch (Exception e) {
                      can = true;
                  }
                  o.put("can", can);
                  call.resolve(o);
              }

              @PluginMethod
              public void fsiAsk(PluginCall call) {
                  try {
                      Intent i;
                      if (Build.VERSION.SDK_INT >= 34) {
                          i = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT);
                          i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      } else {
                          i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                          i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              /* Anruf über dem Sperrbildschirm zeigen (an) oder wieder dahinter (aus) */
              @PluginMethod
              public void lockMode(PluginCall call) {
                  final boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
                  final Activity a = getActivity();
                  if (a != null) {
                      a.runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              MainActivity.lockMode(a, on);
                          }
                      });
                  }
                  call.resolve();
              }

              @PluginMethod
              public void isLocked(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("locked", MainActivity.isLocked(getContext()));
                  call.resolve(o);
              }

              /* Handy entsperren lassen (z. B. bevor man vom Anruf in die Chats geht) */
              @PluginMethod
              public void unlock(final PluginCall call) {
                  final Activity a = getActivity();
                  if (a == null || Build.VERSION.SDK_INT < 26) {
                      done(call, true);
                      return;
                  }
                  a.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              KeyguardManager km = (KeyguardManager) a.getSystemService(Context.KEYGUARD_SERVICE);
                              if (km == null || !km.isKeyguardLocked()) {
                                  done(call, true);
                                  return;
                              }
                              km.requestDismissKeyguard(a, new KeyguardManager.KeyguardDismissCallback() {
                                  @Override
                                  public void onDismissSucceeded() {
                                      done(call, true);
                                  }

                                  @Override
                                  public void onDismissCancelled() {
                                      done(call, false);
                                  }

                                  @Override
                                  public void onDismissError() {
                                      done(call, false);
                                  }
                              });
                          } catch (Exception e) {
                              done(call, false);
                          }
                      }
                  });
              }

              private static void done(PluginCall call, boolean ok) {
                  JSObject o = new JSObject();
                  o.put("ok", ok);
                  call.resolve(o);
              }

              @PluginMethod
              public void batteryStatus(PluginCall call) {
                  JSObject o = new JSObject();
