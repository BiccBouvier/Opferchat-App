          package com.opferchat.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          import com.getcapacitor.JSObject;

          /* Knöpfe in den Anruf-Benachrichtigungen: Ablehnen, Stumm, Lautsprecher, Kamera, Auflegen */
          public class CallActionReceiver extends BroadcastReceiver {
              static final String ACT = "com.opferchat.app.CALL_ACT";

              @Override
              public void onReceive(Context c, Intent in) {
                  if (in == null) return;
                  String a = in.getAction();
                  if (IncomingCall.ACT_DECLINE.equals(a)) {
                      final String gid = in.getStringExtra("gid");
                      final long ts = in.getLongExtra("ts", 0L);
                      IncomingCall.cancel(c, null);
                      JSObject o = new JSObject();
                      o.put("a", "decline");
                      o.put("gid", gid != null ? gid : "");
                      OcNativePlugin.emit("callAction", o);
                      final PendingResult pr = goAsync();
                      final Context ac = c.getApplicationContext();
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  IncomingCall.declineRest(ac, gid, ts);
                              } finally {
                                  try {
                                      pr.finish();
                                  } catch (Exception e) {
                                      /* egal */
                                  }
                              }
                          }
                      }).start();
                      return;
                  }
                  if (ACT.equals(a)) {
                      String what = in.getStringExtra("a");
                      if (what == null) return;
                      if (OcNativePlugin.inst == null) {
                          /* Seite läuft nicht mehr: dann wenigstens die Anzeige beenden */
                          if ("hang".equals(what)) {
                              OcNativePlugin.callActive = false;
                              try {
                                  c.stopService(new Intent(c, CallService.class));
                              } catch (Exception e) {
                                  /* egal */
                              }
                          }
                          return;
                      }
                      JSObject o = new JSObject();
                      o.put("a", what);
                      OcNativePlugin.emit("callAction", o);
                  }
              }
          }
