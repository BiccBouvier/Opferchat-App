          msgsvc = custom and (len(sys.argv) < 4 or sys.argv[3] == '1')
          s = open(path, encoding='utf8').read()
          PERMS = ['ACCESS_NETWORK_STATE', 'CAMERA', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
                   'POST_NOTIFICATIONS', 'VIBRATE', 'WAKE_LOCK', 'RECEIVE_BOOT_COMPLETED', 'SCHEDULE_EXACT_ALARM', 'USE_FULL_SCREEN_INTENT',
                   'BLUETOOTH_CONNECT', 'READ_MEDIA_IMAGES', 'READ_MEDIA_VIDEO', 'USE_BIOMETRIC', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          if custom:
              PERMS += ['FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MICROPHONE', 'FOREGROUND_SERVICE_CAMERA', 'POST_PROMOTED_NOTIFICATIONS']
          FEATS = ['android.hardware.camera', 'android.hardware.camera.autofocus', 'android.hardware.microphone', 'android.hardware.location',
                   'android.hardware.bluetooth', 'android.hardware.fingerprint']
          add = ''
          for p in PERMS:
              if 'android.permission.%s"' % p not in s:
                  add += '    <uses-permission android:name="android.permission.%s" />\n' % p
          for f in FEATS:
              if '"%s"' % f not in s:
                  add += '    <uses-feature android:name="%s" android:required="false" />\n' % f
          i = s.rindex('</manifest>')
          s = s[:i] + add + s[i:]
          if 'largeHeap' not in s:
              s = s.replace('<application', '<application\n        android:largeHeap="true"', 1)
          if custom:
              if 'CallService' not in s:
                  svc = '        <service android:name=".CallService" android:exported="false" android:foregroundServiceType="microphone|camera" />\n'
                  i = s.rindex('</application>')
                  s = s[:i] + svc + s[i:]
              if 'CallActionReceiver' not in s:
                  rcv = '        <receiver android:name=".CallActionReceiver" android:exported="false" />\n'
                  i = s.rindex('</application>')
                  s = s[:i] + rcv + s[i:]
              if msgsvc and 'OcMessagingService' not in s:
                  # Eigener Push-Dienst: Anrufe als Vollbild, alles andere wie bisher. Der von Capacitor fliegt raus, sonst bekommt der die Nachrichten.
                  if 'xmlns:tools=' not in s:
                      s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
                  ms = ('        <service android:name=".OcMessagingService" android:exported="false">\n'
                        '            <intent-filter android:priority="10">\n'
                        '                <action android:name="com.google.firebase.MESSAGING_EVENT" />\n'
                        '            </intent-filter>\n'
                        '        </service>\n'
                        '        <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />\n')
                  i = s.rindex('</application>')
                  s = s[:i] + ms + s[i:]
              if 'android:scheme="opferchat"' not in s:
                  flt = '''            <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="opferchat.com" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="opferchat" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
          '''
                  i = s.index('</activity>')
                  s = s[:i] + flt + '        ' + s[i:]
          xml.dom.minidom.parseString(s.encode('utf8'))  # muss gueltiges XML sein, sonst Abbruch
          open(path, 'w', encoding='utf8').write(s)
          print('Manifest ok, custom=%s, push=%s' % (custom, msgsvc))
          EOF
