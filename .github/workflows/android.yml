name: Android-App bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Projekt anlegen
        run: |
          mkdir -p app/www app/assets
          cd app
          echo '{"name":"opferchat-app","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.opferchat.app","appName":"Opferchat","webDir":"www",
           "server":{"url":"https://opferchat.com","androidScheme":"https","errorPath":"offline.html"},
           "appendUserAgent":"OpferchatApp/1","backgroundColor":"#1d2340",
           "android":{"allowMixedContent":false}}
          EOF
          cat > www/offline.html <<'EOF'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{margin:0;height:100vh;display:grid;place-items:center;background:#1d2340;color:#fff;font:16px system-ui;text-align:center}button{margin-top:18px;padding:12px 22px;border:0;border-radius:14px;background:#ffe14d;font-weight:700;font-size:16px}</style></head>
          <body><div><h2>Keine Verbindung</h2><p>Opferchat braucht Internet.<br>Prüf dein WLAN oder deine mobilen Daten.</p><button onclick="location.href='https://opferchat.com'">Nochmal versuchen</button></div></body></html>
          EOF
          cp www/offline.html www/index.html
          npx cap add android
          npx cap sync android
      - name: App-Symbol und Startbild
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          R=app/android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            n=${d%%:*}; r=${d#*:}; l=${r%%:*}; f=${r#*:}
            mkdir -p $R/mipmap-$n; rm -f $R/mipmap-$n/ic_launcher*.webp
            convert icon.png -resize ${l}x${l} $R/mipmap-$n/ic_launcher.png
            convert icon.png -resize ${l}x${l} $R/mipmap-$n/ic_launcher_round.png
            convert icon.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          [ -f $R/values/ic_launcher_background.xml ] && sed -i 's/#[0-9A-Fa-f]\{6\}/#1d2340/' $R/values/ic_launcher_background.xml
          for f in $(find $R -name 'splash.png'); do
            W=$(identify -format '%w' $f); H=$(identify -format '%h' $f)
            S=$(( (W<H?W:H)*40/100 ))
            convert -size ${W}x${H} xc:'#1d2340' \( icon.png -resize ${S}x${S} \) -gravity center -composite $f
          done
          ls -la $R/mipmap-xxxhdpi
      - name: Rechte und Version eintragen
        run: |
          cd app/android
          M=app/src/main/AndroidManifest.xml
          for p in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS VIBRATE; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          cat $M
      - name: APK bauen und signieren
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../../opferchat.jks --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out ../../Opferchat.apk aligned.apk
          $BT/apksigner verify ../../Opferchat.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Opferchat App 1.0.${{ github.run_number }}
          body: Android-App für Opferchat. Herunterladen, öffnen und installieren.
          files: Opferchat.apk
          make_latest: true
