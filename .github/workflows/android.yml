          ls -la $R/raw
          # Mehr Arbeitsspeicher fuer den Build, Lint bricht den Build nicht ab
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> android/gradle.properties
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p,encoding='utf8').read()
          if 'checkReleaseBuilds' not in s:
              s=re.sub(r'^android \{', 'android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }', s, count=1, flags=re.M)
          if 'useLegacyPackaging' not in s:
              s=re.sub(r'^android \{', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', s, count=1, flags=re.M)
          # Fuer den eigenen Push-Dienst (Anrufe als Vollbild) braucht der App-Teil Firebase Messaging selbst
          if 'firebase-messaging' not in s:
              s=re.sub(r'^dependencies \{', 'dependencies {\n    implementation "com.google.firebase:firebase-messaging:24.1.0" // oc-push', s, count=1, flags=re.M)
          open(p,'w',encoding='utf8').write(s)
          PY
          grep -n "lint" -A3 android/app/build.gradle | head
          grep -n "firebase-messaging" android/app/build.gradle || echo "::warning::firebase-messaging nicht eingetragen"
      - name: App-Symbol und Startbild
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          R=app/android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            n=${d%%:*}; r=${d#*:}; l=${r%%:*}; f=${r#*:}
            mkdir -p $R/mipmap-$n; rm -f $R/mipmap-$n/ic_launcher*.webp
            convert icon.png -resize ${l}x${l} $R/mipmap-$n/ic_launcher.png
            convert icon.png -resize ${l}x${l} $R/mipmap-$n/ic_launcher_round.png
            convert icon.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          [ -f $R/values/ic_launcher_background.xml ] && sed -i 's/#[0-9A-Fa-f]\{6\}/#1d2340/' $R/values/ic_launcher_background.xml
          for f in $(find $R -name 'splash.png'); do
            W=$(identify -format '%w' $f); H=$(identify -format '%h' $f)
            S=$(( (W<H?W:H)*40/100 ))
            convert -size ${W}x${H} xc:'#1d2340' \( icon.png -resize ${S}x${S} \) -gravity center -composite $f
          done
          for d in mdpi:24 hdpi:36 xhdpi:48 xxhdpi:72 xxxhdpi:96; do
            n=${d%%:*}; z=${d#*:}; i=$(( z*85/100 ))
            mkdir -p $R/drawable-$n
            convert icon.png -fuzz 30% -transparent '#1d2340' -fill white -colorize 100 -trim +repage -resize ${i}x${i} -gravity center -background none -extent ${z}x${z} PNG32:$R/drawable-$n/ic_stat_notify.png
          done
          mkdir -p $R/values
          [ -f $R/values/colors.xml ] || printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n' > $R/values/colors.xml
          grep -q 'name="notify_color"' $R/values/colors.xml || sed -i 's|</resources>|    <color name="notify_color">#ffe14d</color>\n</resources>|' $R/values/colors.xml
          ls -la $R/mipmap-xxxhdpi $R/drawable-xxxhdpi
      - name: Rechte und Version eintragen
        run: |
          cd app/android
          M=app/src/main/AndroidManifest.xml
          grep -q default_notification_icon $M || sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notify_color" />\n    </application>#' $M
          cp $M $M.base
          python3 ../patch_manifest.py $M 1
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          cat $M
      - name: APK bauen und signieren
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd app/android
          chmod +x gradlew
          build() { ./gradlew assembleRelease --no-daemon; }
          drop() { L=$(cat "$1"); (cd .. && for n in $L; do npm uninstall --no-audit --no-fund "$n" || true; done && npx cap sync android); }
          LEVEL=""
          if build; then LEVEL="voll"; fi
          if [ -z "$LEVEL" ]; then
            echo "::warning::Bauen mit allem hat nicht geklappt. Nächster Versuch ohne den eigenen Push-Dienst für Anrufe."
            P=app/src/main/java/com/opferchat/app
            rm -f $P/OcMessagingService.java
            sed -i '/oc-push/d' app/build.gradle
            cp app/src/main/AndroidManifest.xml.base app/src/main/AndroidManifest.xml
            python3 ../patch_manifest.py app/src/main/AndroidManifest.xml 1 0
            if build; then LEVEL="ohne Vollbild-Anruf bei geschlossener App"; fi
          fi
          if [ -z "$LEVEL" ]; then
            echo "::warning::Bauen mit allen Zusatzfunktionen hat nicht geklappt. Nächster Versuch ohne die Community-Plugins."
            drop ../opt_community_ok.txt; : > ../opt_community_ok.txt
            if build; then LEVEL="ohne Community-Plugins"; fi
          fi
          if [ -z "$LEVEL" ]; then
            echo "::warning::Nächster Versuch ohne alle Zusatz-Plugins."
            drop ../opt_official_ok.txt; : > ../opt_official_ok.txt
            if build; then LEVEL="nur eigene Funktionen"; fi
          fi
          if [ -z "$LEVEL" ]; then
            echo "::warning::Letzter Versuch ohne die eigenen Android-Teile."
            P=app/src/main/java/com/opferchat/app
            cp ../MainActivity.java.orig $P/MainActivity.java; rm -f $P/OcNativePlugin.java $P/CallService.java $P/IncomingCall.java $P/CallActionReceiver.java $P/OcMessagingService.java; sed -i '/oc-push/d' app/build.gradle
            cp app/src/main/AndroidManifest.xml.base app/src/main/AndroidManifest.xml
            python3 ../patch_manifest.py app/src/main/AndroidManifest.xml 0
            if build; then LEVEL="Basis"; fi
          fi
          if [ -z "$LEVEL" ]; then echo "::error::Die App ließ sich in keiner Stufe bauen."; exit 1; fi
          echo "Ergebnis: $LEVEL"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../../opferchat.jks --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out ../../Opferchat.apk aligned.apk
          $BT/apksigner verify ../../Opferchat.apk
          {
            echo "Android-App für Opferchat. Herunterladen, öffnen und installieren."
            echo
            echo "Umfang: $LEVEL"
            echo
            echo "Enthaltene Zusatz-Plugins:"
            cat ../opt_official_ok.txt ../opt_community_ok.txt | sed 's/^/- /'
          } > ../../release_body.md
          cat ../../release_body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Testversionen bauen (ohne QR-Scanner, Basis)
        continue-on-error: true
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd app/android
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          sign() { $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned2.apk && $BT/apksigner sign --ks ../../opferchat.jks --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out "../../$1" aligned2.apk && $BT/apksigner verify "../../$1"; }
          # 1) wie die volle App, nur ohne QR-Scanner (damit ohne eingebaute Programmbibliotheken)
          if grep -qx '@capacitor-mlkit/barcode-scanning' ../opt_community_ok.txt; then
            (cd .. && npm uninstall --no-audit --no-fund @capacitor-mlkit/barcode-scanning && npx cap sync android)
            ./gradlew assembleRelease --no-daemon && sign Opferchat-ohne-QR.apk || echo "::warning::Testversion ohne QR-Scanner ließ sich nicht bauen"
          fi
          # 2) Basis: wie die App vor dieser Version, ohne Zusatz-Plugins und ohne eigene Android-Teile
          L=$(cat ../opt_official_ok.txt ../opt_community_ok.txt | grep -vx '@capacitor-mlkit/barcode-scanning' || true)
          (cd .. && for n in $L; do npm uninstall --no-audit --no-fund "$n" || true; done && npx cap sync android)
          P=app/src/main/java/com/opferchat/app
          cp ../MainActivity.java.orig $P/MainActivity.java; rm -f $P/OcNativePlugin.java $P/CallService.java $P/IncomingCall.java $P/CallActionReceiver.java $P/OcMessagingService.java; sed -i '/oc-push/d' app/build.gradle
          cp app/src/main/AndroidManifest.xml.base app/src/main/AndroidManifest.xml
          python3 ../patch_manifest.py app/src/main/AndroidManifest.xml 0
          ./gradlew assembleRelease --no-daemon && sign Opferchat-Basis.apk || echo "::warning::Basis-Testversion ließ sich nicht bauen"
          ls -la ../../*.apk
          {
            echo
            echo "Falls Opferchat.apk sich nicht installieren lässt, zum Testen:"
            [ -f ../../Opferchat-ohne-QR.apk ] && echo "- Opferchat-ohne-QR.apk: alles außer dem QR-Scanner"
            [ -f ../../Opferchat-Basis.apk ] && echo "- Opferchat-Basis.apk: nur die Grundfunktionen wie vorher"
          } >> ../../release_body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Opferchat App 1.0.${{ github.run_number }}
          body_path: release_body.md
          files: |
            Opferchat.apk
            Opferchat-ohne-QR.apk
            Opferchat-Basis.apk
          make_latest: true
