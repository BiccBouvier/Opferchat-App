          package com.opferchat.app;

          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Person;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;

          import com.getcapacitor.JSObject;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.Map;

          /* Eingehender Anruf, wenn die App zu ist oder im Hintergrund: klingelt und zeigt den Anruf als Vollbild (auch auf dem Sperrbildschirm). */
          public final class IncomingCall {
              static final String CH = "oc_calls";
              static final String TAG = "oc_ring";
              static final int NID = 7102;
              static final String PREF = "oc_auth";
              static final String ACT_OPEN = "com.opferchat.app.CALL_OPEN";
              static final String ACT_DECLINE = "com.opferchat.app.CALL_DECLINE";
              static volatile String activeGid = null;
              static volatile long activeUntil = 0;
              static volatile JSObject activeData = null;

              private IncomingCall() {
              }

              static boolean isActive() {
                  return activeGid != null && System.currentTimeMillis() < activeUntil;
              }

              /* Push vom Opferchat-Dienst: {type:call, gid, by, n, v, g, ts} */
              static void onPush(Context c, Map<String, String> d) {
                  if (d == null) return;
                  String gid = d.get("gid");
                  if (gid == null || !gid.matches("[A-Za-z0-9_-]{1,120}")) return;
                  /* Ist die App vorne, klingelt die Webseite selbst */
                  if (MainActivity.fg) return;
                  String name = d.get("n");
                  if (name == null || name.trim().isEmpty()) name = "Opferchat";
                  if (name.length() > 60) name = name.substring(0, 60);
                  boolean video = "1".equals(d.get("v"));
                  String grp = d.get("g");
                  if (grp != null && grp.length() > 60) grp = grp.substring(0, 60);
                  long ts = 0;
                  try {
                      String t = d.get("ts");
                      if (t != null) ts = Long.parseLong(t);
                  } catch (Exception e) {
                      ts = 0;
                  }
                  show(c, gid, name, video, grp, d.get("by"), ts);
              }

              static void show(Context c, String gid, String name, boolean video, String grp, String by, long ts) {
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      ensureChannel(c, nm);
                      String kind = video ? label(c, "video", "Videoanruf") : label(c, "voice", "Sprachanruf");
                      String text = grp != null && !grp.isEmpty() ? kind + " · " + grp : kind;
                      PendingIntent full = openPI(c, gid, "ring", 1, name, video, by, ts);
                      PendingIntent accept = openPI(c, gid, "accept", 2, name, video, by, ts);
                      PendingIntent msg = openPI(c, gid, "msg", 3, name, video, by, ts);
                      Intent di = new Intent(c, CallActionReceiver.class);
                      di.setAction(ACT_DECLINE);
                      di.putExtra("gid", gid);
                      di.putExtra("ts", ts);
                      PendingIntent decline = PendingIntent.getBroadcast(c, 7204, di, piFlags());
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, CH) : new Notification.Builder(c);
                      int icon = smallIcon(c);
                      b.setSmallIcon(icon);
                      b.setContentTitle(name);
                      b.setContentText(text);
                      b.setCategory(Notification.CATEGORY_CALL);
                      b.setVisibility(Notification.VISIBILITY_PUBLIC);
                      b.setOngoing(true);
                      b.setAutoCancel(false);
                      b.setContentIntent(full);
                      b.setFullScreenIntent(full, true);
                      if (Build.VERSION.SDK_INT >= 26) {
                          b.setTimeoutAfter(46000);
                      } else {
                          setLegacyAlert(b, c);
                      }
                      Icon ai = Icon.createWithResource(c, icon);
                      if (Build.VERSION.SDK_INT >= 31) {
                          Person p = new Person.Builder().setName(name).setIcon(Icon.createWithBitmap(letter(name))).setImportant(true).build();
                          b.setStyle(Notification.CallStyle.forIncomingCall(p, decline, accept).setIsVideo(video));
                          b.addAction(new Notification.Action.Builder(ai, label(c, "msg", "Nachricht"), msg).build());
                      } else {
                          b.addAction(new Notification.Action.Builder(ai, label(c, "decline", "Ablehnen"), decline).build());
                          b.addAction(new Notification.Action.Builder(ai, label(c, "msg", "Nachricht"), msg).build());
                          b.addAction(new Notification.Action.Builder(ai, label(c, "accept", "Annehmen"), accept).build());
                      }
                      Notification n = b.build();
                      n.flags |= Notification.FLAG_INSISTENT;
                      JSObject o = new JSObject();
                      o.put("gid", gid);
                      o.put("n", name);
                      o.put("v", video);
                      o.put("by", by != null ? by : "");
                      o.put("ts", ts);
                      activeData = o;
                      activeGid = gid;
                      activeUntil = System.currentTimeMillis() + 46000;
                      nm.notify(TAG, NID, n);
                  } catch (Exception e) {
                      /* ohne Benachrichtigungs-Recht geht es nicht */
                  }
              }

              @SuppressWarnings("deprecation")
              private static void setLegacyAlert(Notification.Builder b, Context c) {
                  b.setPriority(Notification.PRIORITY_MAX);
                  b.setSound(ringUri(c));
                  b.setVibrate(new long[]{0, 600, 400, 600});
              }

              /* Klingeln beenden (gid null = egal welcher Anruf) */
              static void cancel(Context c, String gid) {
                  String a = activeGid;
                  if (gid != null && a != null && !gid.equals(a)) return;
                  activeGid = null;
                  activeUntil = 0;
                  activeData = null;
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(TAG, NID);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              /* App wird geöffnet, während es noch klingelt: der Webseite sagen, dass Android schon klingelt */
              static void resumeCheck(Activity a) {
                  try {
                      if (!isActive() || OcNativePlugin.pendingCall != null) return;
                      JSObject d = activeData;
                      JSObject o = new JSObject();
                      o.put("gid", activeGid);
                      o.put("act", "ring");
                      if (d != null) {
                          o.put("n", d.optString("n", ""));
                          o.put("v", d.optBoolean("v", false));
                          o.put("by", d.optString("by", ""));
                          o.put("ts", d.optLong("ts", 0));
                      }
                      o.put("locked", MainActivity.isLocked(a));
                      OcNativePlugin.setLaunch(o);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              static PendingIntent openPI(Context c, String gid, String act, int rc, String name, boolean video, String by, long ts) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.setAction(ACT_OPEN);
                  i.putExtra("gid", gid);
                  i.putExtra("act", act);
                  i.putExtra("n", name);
                  i.putExtra("v", video);
                  i.putExtra("by", by != null ? by : "");
                  i.putExtra("ts", ts);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(c, 7200 + rc, i, piFlags());
              }

              static int piFlags() {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) f |= PendingIntent.FLAG_IMMUTABLE;
                  return f;
              }

              static int smallIcon(Context c) {
                  int icon = c.getResources().getIdentifier("ic_stat_notify", "drawable", c.getPackageName());
                  return icon != 0 ? icon : c.getApplicationInfo().icon;
              }

              static Uri ringUri(Context c) {
                  int id = c.getResources().getIdentifier("oc_ring", "raw", c.getPackageName());
                  if (id != 0) return Uri.parse("android.resource://" + c.getPackageName() + "/" + id);
                  return RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
              }

              /* Den Kanal legt sonst die Webseite an (mit dem Klingelton, den man in den Einstellungen ändern kann) */
              static void ensureChannel(Context c, NotificationManager nm) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  if (nm.getNotificationChannel(CH) != null) return;
                  NotificationChannel ch = new NotificationChannel(CH, label(c, "ch", "Anrufe"), NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription(label(c, "chd", "Wenn dich jemand anruft"));
                  ch.enableVibration(true);
                  ch.setVibrationPattern(new long[]{0, 600, 400, 600});
                  ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                  ch.setSound(ringUri(c), aa);
                  nm.createNotificationChannel(ch);
              }

              /* Texte in der Sprache der App (schickt die Webseite mit), sonst Deutsch */
              static String label(Context c, String k, String def) {
                  try {
                      String j = c.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("lb", "");
                      if (j == null || j.isEmpty()) return def;
                      String v = new JSONObject(j).optString(k, "");
                      return v.isEmpty() ? def : v;
                  } catch (Exception e) {
                      return def;
                  }
              }

              /* Rundes Bild mit dem ersten Buchstaben des Namens */
              static Bitmap letter(String name) {
                  int s = 128;
                  Bitmap bm = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bm);
                  int[] cols = {0xFF5B6CFF, 0xFFFF7A59, 0xFF20A058, 0xFFD99A00, 0xFFB45CFF, 0xFF00A3C4};
                  String nm = name == null ? "" : name.trim();
                  int h = (nm.hashCode() & 0x7fffffff) % cols.length;
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(cols[h]);
                  cv.drawCircle(s / 2f, s / 2f, s / 2f, p);
                  p.setColor(Color.WHITE);
                  p.setTextSize(s * 0.46f);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  String ch = nm.isEmpty() ? "?" : nm.substring(0, nm.offsetByCodePoints(0, 1)).toUpperCase();
                  Paint.FontMetrics fm = p.getFontMetrics();
                  float y = s / 2f - (fm.ascent + fm.descent) / 2f;
                  cv.drawText(ch, s / 2f, y, p);
                  return bm;
              }

              /* Ablehnen, ohne die App zu öffnen: mit dem gespeicherten Anmeldeschlüssel direkt in die Datenbank schreiben */
              static void declineRest(Context c, String gid, long ts) {
                  try {
                      if (gid == null || !gid.matches("[A-Za-z0-9_-]{1,120}")) return;
                      SharedPreferences sp = c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                      String rt = sp.getString("rt", ""), key = sp.getString("key", ""), db = sp.getString("db", ""), uid = sp.getString("uid", "");
                      if (rt == null || key == null || db == null || uid == null) return;
                      if (rt.isEmpty() || key.isEmpty() || !db.startsWith("https://") || !uid.matches("[A-Za-z0-9_-]{1,128}")) return;
                      String body = "grant_type=refresh_token&refresh_token=" + URLEncoder.encode(rt, "UTF-8");
                      JSONObject tok = new JSONObject(http("POST", "https://securetoken.googleapis.com/v1/token?key=" + URLEncoder.encode(key, "UTF-8"), body, "application/x-www-form-urlencoded"));
                      String id = tok.optString("id_token", "");
                      String nrt = tok.optString("refresh_token", "");
                      if (id.isEmpty()) return;
                      if (!nrt.isEmpty() && !nrt.equals(rt)) sp.edit().putString("rt", nrt).apply();
                      JSONObject w = new JSONObject();
                      w.put("ring/" + uid + "/" + gid, JSONObject.NULL);
                      if (ts == 0 || Math.abs(System.currentTimeMillis() - ts) < 120000) {
                          JSONObject sv = new JSONObject();
                          sv.put(".sv", "timestamp");
                          w.put("calls/" + gid + "/dec/" + uid, sv);
                      }
                      String base = db.endsWith("/") ? db.substring(0, db.length() - 1) : db;
                      http("PATCH", base + "/.json?auth=" + URLEncoder.encode(id, "UTF-8"), w.toString(), "application/json");
                  } catch (Exception e) {
                      /* dann merkt der Anrufer es erst nach 45 Sekunden */
                  }
              }

              static String http(String method, String url, String body, String type) throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL(url).openConnection();
                  try {
                      h.setConnectTimeout(8000);
                      h.setReadTimeout(8000);
                      if ("PATCH".equals(method)) {
                          h.setRequestMethod("POST");
                          h.setRequestProperty("X-HTTP-Method-Override", "PATCH");
                      } else {
                          h.setRequestMethod(method);
                      }
                      if (body != null) {
                          h.setDoOutput(true);
                          h.setRequestProperty("Content-Type", type);
                          byte[] bs = body.getBytes("UTF-8");
                          OutputStream os = h.getOutputStream();
                          os.write(bs);
                          os.close();
                      }
                      int code = h.getResponseCode();
                      InputStream in = code >= 400 ? h.getErrorStream() : h.getInputStream();
                      if (in == null) {
                          if (code >= 400) throw new Exception("http " + code);
                          return "";
                      }
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                      if (code >= 400) throw new Exception("http " + code);
                      return bo.toString("UTF-8");
                  } finally {
                      h.disconnect();
                  }
              }
          }
