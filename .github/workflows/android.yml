          package com.opferchat.app;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.JSObject;

          public class MainActivity extends BridgeActivity {
              /* Ist die App gerade vorne? Dann klingelt die Webseite selbst. */
              static volatile boolean fg = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(OcNativePlugin.class);
                  super.onCreate(savedInstanceState);
                  fixTextZoom();
                  if (savedInstanceState == null) {
                      OcNativePlugin.handleIntent(getIntent());
                      handleCall(getIntent());
                  }
              }

              /* Feste Groesse: Die Schriftgroesse des Handys soll die App nicht zusammenquetschen oder auseinanderziehen.
                 Grosse Schrift gibt es in der App selbst (Einstellungen, Schrift und Groesse). */
              private void fixTextZoom() {
                  try {
                      WebView w = getBridge().getWebView();
                      w.getSettings().setTextZoom(100);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  fg = true;
                  fixTextZoom();
                  IncomingCall.resumeCheck(this);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  OcNativePlugin.handleIntent(intent);
                  handleCall(intent);
              }

              @Override
              public void onPause() {
                  super.onPause();
                  fg = false;
                  /* Waehrend eines Anrufs soll die Seite im Hintergrund weiterlaufen. */
                  if (OcNativePlugin.callActive) {
                      try {
                          WebView w = getBridge().getWebView();
                          w.onResume();
                          w.resumeTimers();
                      } catch (Exception e) {
                          /* egal */
                      }
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  /* Ohne Anruf nie über dem Sperrbildschirm bleiben */
                  if (!OcNativePlugin.callActive && !IncomingCall.isActive()) lockMode(this, false);
              }

              /* Geöffnet über die Anruf-Benachrichtigung: Klingeln (Vollbild), Annehmen, Nachricht oder laufender Anruf */
              private void handleCall(Intent in) {
                  try {
                      if (in == null || !IncomingCall.ACT_OPEN.equals(in.getAction())) return;
                      String gid = in.getStringExtra("gid");
                      String act = in.getStringExtra("act");
                      if (gid == null) return;
                      if (act == null) act = "ring";
                      if (!"open".equals(act)) lockMode(this, true);
                      if ("accept".equals(act) || "msg".equals(act)) IncomingCall.cancel(this, null);
                      JSObject o = new JSObject();
                      o.put("gid", gid);
                      o.put("act", act);
                      String n = in.getStringExtra("n");
                      String by = in.getStringExtra("by");
                      o.put("n", n != null ? n : "");
                      o.put("by", by != null ? by : "");
                      o.put("v", in.getBooleanExtra("v", false));
                      o.put("ts", in.getLongExtra("ts", 0L));
                      o.put("locked", isLocked(this));
                      OcNativePlugin.setLaunch(o);
                      in.setAction(null);
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              @SuppressWarnings("deprecation")
              static void lockMode(Activity a, boolean on) {
                  try {
                      if (Build.VERSION.SDK_INT >= 27) {
                          a.setShowWhenLocked(on);
                          a.setTurnScreenOn(on);
                      } else {
                          int f = WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON;
                          if (on) a.getWindow().addFlags(f);
                          else a.getWindow().clearFlags(f);
                      }
                  } catch (Exception e) {
                      /* egal */
                  }
              }

              static boolean isLocked(Context c) {
                  try {
                      KeyguardManager km = (KeyguardManager) c.getSystemService(Context.KEYGUARD_SERVICE);
                      return km != null && km.isKeyguardLocked();
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
